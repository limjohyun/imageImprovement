[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-improvement"
version = "0.1.0"
description = "스마트폰 촬영 이미지(PACS 화면/PPT/악보 등)를 인식·보정해 고화질 PDF로 만드는 개인용 도구"
readme = "README.md"
# Python 3.13은 PEP 667(locals() 동작 변경)로 basicsr(Real-ESRGAN 의존성) 설치 자체가
# 깨지는 것을 실제로 재현 확인했다(3.14 이상은 미검증이라 상한을 3.13 미만으로 제한).
requires-python = ">=3.12,<3.13"

# Phase1에서 실제로 설치·검증된 버전으로 고정한다(basicsr/torchvision 조합이
# 실제로 한 번 깨진 전례가 있어 버전 드리프트를 막기 위함, scripts/patch_basicsr.py 참고).
# torch만 base 버전(2.13.0)으로 고정하고 실제 CPU 빌드(+cpu) 선택은
# README의 별도 인덱스(https://download.pytorch.org/whl/cpu) 설치 단계가 담당한다.
# vtracer는 Phase2-3(DIA-2 벡터화)에서 실제로 착수해 추가했다.
# oemer(Phase3), supabase-py(Phase5) 등은 해당 Phase 착수 시점에 추가한다.
dependencies = [
    "opencv-python==5.0.0.93",
    "numpy==2.5.2",
    "Pillow==12.3.0",
    "pymupdf==1.28.2",
    "img2pdf==0.6.3",
    "reportlab==5.0.1",
    "pyside6==6.11.2",
    "pytesseract==0.3.13",
    "ocrmypdf==17.10.0",
    "torch==2.13.0",
    "realesrgan==0.3.0",
    "basicsr==1.4.2",
    "vtracer==0.6.15",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.16.3",
    # 합성 악보 fixture(tests/fixtures/synthetic.py) 생성용. 실제 엔그레이빙 렌더링은
    # MuseScore(Phase3에서 설치 예정) 실행 파일이 있을 때만 동작하고, 없으면 skip된다.
    "music21==10.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 무거운 ML 추론 등 실행 시간이 긴 테스트 (기본 실행 대상에서 배제하지 않음, 필요 시 -m 'not slow'로 제외)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
